<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日事</title>
<meta name="theme-color" content="#F3F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日事">
<script>try{var th=JSON.parse(localStorage.getItem('todo.meta.v1')||'{}').theme;if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F1;      /* 日曆紙底 */
  --sheet:#FFFFFF;
  --ink:#1D2330;
  --ink-2:#5B6270;
  --rule:#DCDFD9;
  --red:#C3302A;        /* 撕日曆的紅 */
  --done:#3D7A57;
  --hole:#E6E8E3;
  --urg-bg:#FBE9E7;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15181E; --sheet:#1F232B; --ink:#ECEDEA; --ink-2:#9AA0AA;
    --rule:#2F343D; --red:#E2574F; --done:#6DB58A; --hole:#15181E; --urg-bg:#3A2224;
  }
}
:root[data-theme="dark"]{
    --paper:#15181E; --sheet:#1F232B; --ink:#ECEDEA; --ink-2:#9AA0AA;
    --rule:#2F343D; --red:#E2574F; --done:#6DB58A; --hole:#15181E; --urg-bg:#3A2224;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
body{min-height:100dvh;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 108px);}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto}

/* ── 日曆紙（主視覺）── */
.sheet{
  position:relative;background:var(--sheet);border-radius:4px 4px 14px 14px;
  padding:0 20px 18px;margin-top:16px;overflow:hidden;
  box-shadow:0 1px 0 var(--rule), 0 10px 24px -18px rgba(29,35,48,.45);
}
.sheet::before{ /* 上方裝訂孔 */
  content:"";position:absolute;top:3px;left:8px;right:8px;height:10px;z-index:1;
  background:radial-gradient(circle at 5px 5px,var(--paper) 3.2px,transparent 3.8px) 0 0/20px 10px;background-repeat:space no-repeat;
}
.sheet-top{display:flex;justify-content:space-between;align-items:baseline;margin:0 -20px;padding:20px 20px 11px;background:var(--red);color:#fff;font-size:15px;font-weight:500}
.sheet-top #relDay{font-size:13px;background:rgba(255,255,255,.18);padding:2px 10px;border-radius:999px}
.sheet-top .ym{letter-spacing:.04em}
.big{
  font-family:var(--serif);font-weight:900;font-size:min(42vw,200px);line-height:.86;
  text-align:center;margin:22px 0 6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
.big.red{color:var(--red)}
.wd{text-align:center;font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.3em;padding-left:.3em}
.wd.red{color:var(--red)}
.tally{margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule);text-align:center;color:var(--ink-2);font-size:14px}
.prog{height:4px;border-radius:2px;background:var(--rule);margin:10px auto 0;max-width:220px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--done);border-radius:2px;transition:width .35s ease}
.sheet.flip{animation:flip .38s ease-out}
@keyframes flip{from{transform:translateY(-8px) rotateX(18deg);opacity:.2}to{transform:none;opacity:1}}

/* ── 一週 ── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0 6px}
.day{
  border:0;background:transparent;padding:8px 0 10px;border-radius:10px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-2);
}
.day b{font-weight:600;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.day small{font-size:12px}
.day i{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px}
.day.has i{background:var(--ink-2)}
.day.urg i{background:var(--red)}
.day.sun b{color:var(--red)}
.day.today b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.day.sel{background:var(--ink)}
.day.sel b,.day.sel small{color:var(--paper)}
.day.sel.has i{background:var(--paper)}
.weeknav{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-2)}
.weeknav button{border:0;background:none;padding:6px 4px;color:var(--ink-2)}
.weeknav .back{color:var(--red)}

/* ── 清單 ── */
h2{font-size:14px;font-weight:600;color:var(--ink-2);margin:26px 2px 4px;display:flex;justify-content:space-between}
h2 .cnt{font-weight:400;font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0}
li.item{
  display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;
  padding:13px 2px;border-bottom:1px solid var(--rule);
}
.check{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-2);background:transparent;
  display:grid;place-items:center;padding:0;
}
.check svg{width:14px;height:14px;opacity:0;stroke:var(--sheet)}
li.done .check{background:var(--done);border-color:var(--done)}
li.done .check svg{opacity:1}
li.just .check{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.txt{min-width:0}
.title{font-size:17px;line-height:1.35;word-break:break-word}
li.done .title{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--ink-2)}
.meta{font-size:13px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.meta .late{color:var(--red)}
.more{border:0;background:none;width:36px;height:36px;border-radius:50%;color:var(--ink-2);font-size:20px;line-height:1}
.empty{padding:30px 8px;color:var(--ink-2);font-size:15px;line-height:1.7;text-align:center;border-bottom:1px dashed var(--rule)}

/* ── 底部輸入列 ── */
.bar{
  position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(var(--safe-b) + 10px);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--rule);
}
.bar form{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .t:focus,.bar .tm:focus{border-color:var(--ink-2);outline:none}
.bar .add:active,.bar .urg:active{transform:scale(.96)}
.bar .t{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);padding:0 14px;font-size:17px}
.bar .tm{width:84px;height:46px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);padding:0 8px;font-size:15px}
.bar .add{height:46px;border:0;border-radius:12px;background:var(--red);color:#fff;padding:0 16px;font-weight:600}

/* ── 設定與動作面板 ── */
.topline{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0}
.brand{margin:0;font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.06em}
.tools{display:flex;gap:6px}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);display:grid;place-items:center;padding:0}
.ib svg{width:20px;height:20px}
.ib:active{transform:scale(.94)}
.bell .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--done);border:2px solid var(--sheet);display:none}
.bell.on{color:var(--ink)}
.bell.on .dot{display:block}
.pill{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 12px;font-size:14px;color:var(--ink-2)}
dialog{border:0;border-radius:16px;padding:0;background:var(--sheet);color:var(--ink);width:min(92vw,420px)}
dialog::backdrop{background:rgba(10,12,16,.4)}
.dlg{padding:20px}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.6}
.dlg .row{display:flex;flex-direction:column;gap:8px}
.dlg button{height:46px;border-radius:12px;border:1px solid var(--rule);background:transparent;font-size:16px}
.dlg button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dlg button.danger{color:var(--red)}
.dlg label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
.dlg input{width:100%;height:44px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);padding:0 12px;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
/* ── 急件 ── */
li.urgent:not(.done){background:linear-gradient(90deg,var(--urg-bg),transparent 70%);box-shadow:inset 3px 0 0 var(--red);padding-left:8px;border-radius:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--red);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px}
li.done .tag{background:var(--ink-2)}
.bar .urg{height:46px;width:46px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);font-weight:700;font-size:16px;flex:none}
.bar .urg[aria-pressed="true"]{background:var(--urg-bg);border-color:var(--red);color:var(--red)}
.switch{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:16px}
.switch input{width:22px;height:22px;accent-color:var(--red)}
/* ── 完成刪除 ── */
.del{border:0;background:none;width:36px;height:36px;border-radius:50%;color:var(--ink-2);display:grid;place-items:center}
.del svg{width:18px;height:18px}
[hidden]{display:none !important}
.clear{display:block;margin:14px auto 0;border:0;background:none;color:var(--ink-2);font-size:14px;padding:8px 12px;text-decoration:underline;text-underline-offset:3px}
/* ── 月曆 ── */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead h3{margin:0;font-family:var(--serif);font-weight:900;font-size:24px}
.mhead button{border:1px solid var(--rule);background:transparent;width:40px;height:40px;border-radius:50%;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mgrid .wdh{font-size:12px;color:var(--ink-2);padding:4px 0}
.mgrid .wdh:first-child{color:var(--red)}
.mcell{border:0;background:transparent;aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-variant-numeric:tabular-nums}
.dlg .mcell{border:0;height:auto;font-size:inherit}
.mcell b{font-weight:600;font-size:16px}
.mcell.out{opacity:.32}
.mcell.sun b{color:var(--red)}
.mcell.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.mcell.sel{background:var(--ink)}
.mcell.sel b,.mcell.sel .n{color:var(--paper)}
.mcell .n{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:3px;min-height:12px}
.mcell .u{width:6px;height:6px;border-radius:50%;background:var(--red)}
.mcell .ok{color:var(--done)}
.mfoot{display:flex;gap:8px;margin-top:14px}
.mfoot button{flex:1;height:44px;border-radius:12px;border:1px solid var(--rule);background:transparent;font-size:15px}
.legend{font-size:12px;color:var(--ink-2);margin-top:10px;display:flex;gap:12px;justify-content:center;align-items:center}
.legend .u{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:4px;vertical-align:1px}
@media (prefers-reduced-motion: reduce){li.just .check{animation:none}.prog i{transition:none}.sheet.flip{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topline"><h1 class="brand">今日事</h1><div class="tools"><button class="ib" id="themeBtn" type="button"></button><button class="ib" id="monthBtn" type="button" aria-label="打開整月月曆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button><button class="ib bell" id="bellBtn" type="button" aria-label="開啟通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><i class="dot"></i></button></div></header>

  <section class="sheet" id="sheet" aria-live="polite" role="button" tabindex="0" aria-label="打開整月月曆" style="cursor:pointer">
    <div class="sheet-top"><span class="ym" id="ym"></span><span id="relDay"></span></div>
    <div class="big" id="big"></div>
    <div class="wd" id="wd"></div>
    <div class="tally"><span id="tally"></span><div class="prog" aria-hidden="true"><i id="progBar"></i></div></div>
  </section>

  <div class="week" id="week"></div>
  <div class="weeknav">
    <button type="button" id="prevW">‹ 上週</button>
    <button type="button" class="back" id="toToday" hidden>回到今天</button>
    <button type="button" id="nextW">下週 ›</button>
  </div>

  <div id="lateBox" hidden>
    <h2>之前沒做完</h2>
    <ul id="lateList"></ul>
  </div>
  <h2 id="listHead">今天要做的事</h2>
  <ul id="list"></ul>
  <button type="button" class="clear" id="clearDone" hidden></button>
</div>

<div class="bar">
  <form id="addForm" autocomplete="off">
    <input class="t" id="newTitle" placeholder="新增一件事…" enterkeyhint="done" aria-label="事項內容">
    <input class="tm" id="newTime" type="time" aria-label="提醒時間（可不填）">
    <button class="urg" id="newUrg" type="button" aria-pressed="false" aria-label="標為急件">急</button>
    <button class="add" type="submit">加入</button>
  </form>
</div>

<!-- 單一事項的動作 -->
<dialog id="itemDlg"><form method="dialog" class="dlg" id="itemForm">
  <h3>編輯事項</h3>
  <label for="eTitle">內容</label><input id="eTitle">
  <label for="eDate">日期</label><input id="eDate" type="date">
  <label for="eTime">提醒時間</label><input id="eTime" type="time">
  <label class="switch" for="eUrg"><span>急件</span><input id="eUrg" type="checkbox"></label>
  <div class="row" style="margin-top:16px">
    <button class="primary" value="save">儲存</button>
    <button type="button" id="icsBtn">加入 iPhone 行事曆（準時提醒）</button>
    <button type="button" class="danger" id="delBtn">刪除</button>
    <button value="cancel">取消</button>
  </div>
</form></dialog>

<!-- 通知說明 -->
<dialog id="noteDlg"><form method="dialog" class="dlg">
  <h3 id="noteH">通知</h3>
  <p id="noteP"></p>
  <div class="row"><button class="primary" value="ok">知道了</button></div>
</form></dialog>

<!-- 整月月曆 -->
<dialog id="monthDlg"><div class="dlg">
  <div class="mhead"><button type="button" id="mPrev" aria-label="上個月">‹</button><h3 id="mTitle"></h3><button type="button" id="mNext" aria-label="下個月">›</button></div>
  <div class="mgrid" id="mGrid"></div>
  <div class="legend"><span><span class="u"></span>有急件</span><span>數字＝未完成件數</span><span class="ok" style="color:var(--done)">✓ 全部完成</span></div>
  <div class="mfoot"><button type="button" id="mToday">回到今天</button><button type="button" id="mClose">關閉</button></div>
</div></dialog>

<div class="toast" id="toast" role="status"></div>

<script>
/* ========= 資料 ========= */
const KEY = 'todo.items.v1';
const META = 'todo.meta.v1';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
let items = load(KEY, []);
let meta = load(META, {});
const persist = () => save(KEY, items);

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d) };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x };
const WD = ['日','一','二','三','四','五','六'];
const todayStr = () => ymd(new Date());

let selected = todayStr();
let lastToday = selected;
let weekStart = startOfWeek(new Date());
function goTo(s){ selected = s; weekStart = startOfWeek(parse(s)); render(true) }
function startOfWeek(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x }

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ========= 畫面 ========= */
function render(flip){
  const sel = parse(selected), t = todayStr();
  const isSun = sel.getDay() === 0;
  $('ym').textContent = `${sel.getFullYear()} 年 ${sel.getMonth()+1} 月`;
  const diff = Math.round((sel - parse(t)) / 864e5);
  $('relDay').textContent = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === -1 ? '昨天' : (diff > 0 ? `${diff} 天後` : `${-diff} 天前`);
  $('big').textContent = sel.getDate();
  $('big').classList.toggle('red', isSun);
  $('wd').textContent = '星期' + WD[sel.getDay()];
  $('wd').classList.toggle('red', isSun);

  const day = items.filter(i => i.date === selected).sort(byTime);
  const left = day.filter(i => !i.done).length;
  $('progBar').style.width = day.length ? `${(day.length - left) / day.length * 100}%` : '0%';
  $('tally').textContent = day.length === 0 ? '這天還沒有安排'
    : left === 0 ? `${day.length} 件都完成了` : `還有 ${left} 件，完成 ${day.length - left} 件`;

  if (flip){ const s = $('sheet'); s.classList.remove('flip'); void s.offsetWidth; s.classList.add('flip') }

  // 週列
  const wk = $('week'); wk.innerHTML = '';
  for (let n = 0; n < 7; n++){
    const d = addDays(weekStart, n), s = ymd(d);
    const has = items.some(i => i.date === s && !i.done);
    const urgDay = items.some(i => i.date === s && !i.done && i.urgent);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'day' + (s === selected ? ' sel' : '') + (s === t ? ' today' : '') + (n === 0 ? ' sun' : '') + (has ? ' has' : '') + (urgDay ? ' urg' : '');
    b.innerHTML = `<small>${WD[n]}</small><b>${d.getDate()}</b><i></i>`;
    b.setAttribute('aria-label', `${d.getMonth()+1}月${d.getDate()}日 星期${WD[n]}${has ? '，有未完成事項' : ''}`);
    b.onclick = () => { selected = s; render(true) };
    wk.appendChild(b);
  }
  $('toToday').hidden = selected === t;

  // 今天才顯示延誤事項
  const late = selected === t ? items.filter(i => !i.done && i.date < t).sort((a,b)=>a.date.localeCompare(b.date)||byTime(a,b)) : [];
  $('lateBox').hidden = late.length === 0;
  $('lateList').innerHTML = late.map(i => row(i, true)).join('');

  const doneN = day.filter(i => i.done).length;
  $('clearDone').hidden = doneN === 0;
  $('clearDone').textContent = `刪除這天已完成的 ${doneN} 件`;
  $('listHead').innerHTML = (selected === t ? '今天要做的事' : `${sel.getMonth()+1}/${sel.getDate()} 要做的事`) + (day.length ? `<span class="cnt">${day.length - left}/${day.length}</span>` : '');
  $('list').innerHTML = day.length ? day.map(i => row(i)).join('')
    : `<li class="empty">${selected === t ? '今天還空著。在下方輸入第一件事，有時間的話選個提醒時間。' : '這天還沒有事項。在下方輸入就會加到這一天。'}</li>`;
}
function byTime(a, b){ return (a.done - b.done) || ((!!b.urgent) - (!!a.urgent)) || (a.time || '99').localeCompare(b.time || '99') || a.created - b.created }
function row(i, late){
  const d = parse(i.date);
  const metaParts = [];
  if (late) metaParts.push(`<span class="late">${d.getMonth()+1}/${d.getDate()}</span>`);
  if (i.time) metaParts.push(`${i.time} 提醒`);
  if (i.cal) metaParts.push('已加入行事曆');
  const tag = i.urgent ? '<span class="tag">急件</span>' : '';
  const action = i.done
    ? `<button class="del" data-act="del" aria-label="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>`
    : `<button class="more" data-act="edit" aria-label="編輯">⋯</button>`;
  return `<li class="item${i.done ? ' done' : ''}${i.urgent ? ' urgent' : ''}${i.id === justId ? ' just' : ''}" data-id="${i.id}">
    <button class="check" data-act="toggle" aria-label="${i.done ? '標為未完成' : '標為完成'}">
      <svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
    </button>
    <div class="txt"><div class="title">${tag}${esc(i.title)}</div>${metaParts.length ? `<div class="meta">${metaParts.join('　')}</div>` : ''}</div>
    ${action}
  </li>`;
}

/* ========= 操作 ========= */
let newUrg = false, justId = null;
function setNewUrg(v){ newUrg = v; $('newUrg').setAttribute('aria-pressed', String(v)) }
$('newUrg').onclick = () => setNewUrg(!newUrg);
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('newTitle').value.trim();
  if (!title){ $('newTitle').focus(); return }
  items.push({ id: crypto.randomUUID?.() || String(Date.now()) + Math.random(), title, date: selected, time: $('newTime').value || '', urgent: newUrg, done: false, created: Date.now() });
  persist();
  $('newTitle').value = ''; $('newTime').value = ''; setNewUrg(false);
  render(); scheduleTimers();
  toast('已加入');
});
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const id = btn.closest('li').dataset.id, it = items.find(i => i.id === id); if (!it) return;
  if (btn.dataset.act === 'toggle'){ it.done = !it.done; justId = it.done ? it.id : null; persist(); render(); justId = null; scheduleTimers() }
  if (btn.dataset.act === 'edit') openEdit(it);
  if (btn.dataset.act === 'del'){ items = items.filter(x => x !== it); persist(); render(); toast('已刪除') }
});
function shiftWeek(n){ weekStart = addDays(weekStart, n); selected = ymd(addDays(parse(selected), n)); render(true) }
$('clearDone').onclick = () => {
  const n = items.filter(i => i.date === selected && i.done).length;
  items = items.filter(i => !(i.date === selected && i.done)); persist(); render(); toast(`已刪除 ${n} 件`);
};
$('prevW').onclick = () => shiftWeek(-7);
$('nextW').onclick = () => shiftWeek(7);
$('toToday').onclick = () => { selected = todayStr(); weekStart = startOfWeek(new Date()); render(true) };

let editing = null;
function openEdit(it){
  editing = it;
  $('eTitle').value = it.title; $('eDate').value = it.date; $('eTime').value = it.time; $('eUrg').checked = !!it.urgent;
  $('itemDlg').showModal();
}
$('itemDlg').addEventListener('close', () => {
  if ($('itemDlg').returnValue === 'save' && editing){
    const t = $('eTitle').value.trim();
    if (t) editing.title = t;
    if ($('eDate').value) editing.date = $('eDate').value;
    editing.time = $('eTime').value || '';
    editing.urgent = $('eUrg').checked;
    persist(); render(); scheduleTimers(); toast('已儲存');
  }
  editing = null;
});
$('delBtn').onclick = () => {
  if (!editing) return;
  items = items.filter(i => i !== editing); persist();
  editing = null; $('itemDlg').close('cancel'); render(); scheduleTimers(); toast('已刪除');
};
$('icsBtn').onclick = () => {
  if (!editing) return;
  // 先套用目前欄位
  const it = { ...editing, title: $('eTitle').value.trim() || editing.title, date: $('eDate').value || editing.date, time: $('eTime').value || '' };
  downloadIcs(it);
  editing.cal = true; persist();
};

/* ========= 行事曆（.ics，iPhone 會在背景準時提醒）========= */
function downloadIcs(it){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const d = it.date.replace(/-/g,'');
  const fold = s => s.replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g,'\\n');
  let when, alarm;
  if (it.time){
    const t = it.time.replace(':','') + '00';
    const [h, m] = it.time.split(':').map(Number);
    const end = new Date(2000,0,1,h,m+30);
    when = `DTSTART;TZID=Asia/Taipei:${d}T${t}\r\nDTEND;TZID=Asia/Taipei:${d}T${pad(end.getHours())}${pad(end.getMinutes())}00`;
    alarm = 'TRIGGER:PT0M';
  } else {
    const next = ymd(addDays(parse(it.date), 1)).replace(/-/g,'');
    when = `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${next}`;
    alarm = 'TRIGGER:PT9H'; // 全天事項：當天早上 9 點提醒
  }
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//todo//zh-TW','CALSCALE:GREGORIAN',
    'BEGIN:VTIMEZONE','TZID:Asia/Taipei','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0800','TZOFFSETTO:+0800','TZNAME:CST','END:STANDARD','END:VTIMEZONE',
    'BEGIN:VEVENT',`UID:${it.id}@todo`,`DTSTAMP:${stamp}`, when, `SUMMARY:${fold(it.title)}`,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${fold(it.title)}`, alarm,'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'todo.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ========= 通知 ========= */
const canNotify = 'Notification' in window && 'serviceWorker' in navigator;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function bellState(){
  const on = canNotify && Notification.permission === 'granted';
  $('bellBtn').classList.toggle('on', on);
  $('bellBtn').setAttribute('aria-label', on ? '通知已開啟' : '開啟通知');
}
function note(h, p){ $('noteH').textContent = h; $('noteP').textContent = p; $('noteDlg').showModal() }

$('bellBtn').onclick = async () => {
  if (isIOS && !standalone){
    return note('先加到主畫面', '在 Safari 點下方「分享」按鈕 →「加入主畫面」，再從主畫面打開這個 App，就能開啟通知（需 iOS 16.4 以上）。');
  }
  if (!canNotify) return note('無法通知', '這個瀏覽器不支援網頁通知。可以在事項的「⋯」裡選「加入 iPhone 行事曆」改用行事曆提醒。');
  if (Notification.permission === 'denied') return note('通知被關閉了', '請到 iPhone「設定」→「通知」→ 找到「今日事」並允許通知。');
  if (Notification.permission === 'granted'){
    return note('通知怎麼運作', '打開 App 時會提醒今天還沒做完的事；App 開著時，到了設定的時間也會跳通知。若要在 App 關閉時也準時提醒，請在事項「⋯」裡選「加入 iPhone 行事曆」。');
  }
  const r = await Notification.requestPermission();
  bellState();
  if (r === 'granted'){ meta.lastSummary = ''; save(META, meta); dailySummary(true) }
};

async function notify(title, body, tag){
  if (!canNotify || Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification(title, { body, tag, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png' });
  } catch { try { new Notification(title, { body, tag }) } catch {} }
}

// 每天第一次打開：彙整今天的未完成事項
function dailySummary(force){
  const t = todayStr();
  if (!force && meta.lastSummary === t) return;
  const todo = items.filter(i => !i.done && i.date <= t);
  if (!todo.length) return;
  const today = todo.filter(i => i.date === t).sort(byTime);
  const late = todo.length - today.length;
  const lines = today.slice(0, 4).map(i => (i.urgent ? '【急】' : '') + (i.time ? i.time + ' ' : '・') + i.title);
  if (today.length > 4) lines.push(`…還有 ${today.length - 4} 件`);
  if (late) lines.push(`另有 ${late} 件之前沒做完`);
  notify(`今天有 ${today.length} 件事`, lines.join('\n'), 'daily-' + t);
  meta.lastSummary = t; save(META, meta);
}

// App 開著時：到點提醒
let timers = [];
function scheduleTimers(){
  timers.forEach(clearTimeout); timers = [];
  const t = todayStr(), now = Date.now();
  meta.fired = (meta.fired || []).filter(k => k.startsWith(t));
  items.filter(i => !i.done && i.date === t && i.time).forEach(i => {
    const [h, m] = i.time.split(':').map(Number);
    const at = parse(t); at.setHours(h, m, 0, 0);
    const key = t + '|' + i.id + '|' + i.time;
    const ms = at - now;
    if (meta.fired.includes(key)) return;
    if (ms <= 0 && ms > -5 * 60e3) fire(i, key);          // 剛過 5 分鐘內，補發
    else if (ms > 0 && ms < 864e5) timers.push(setTimeout(() => fire(i, key), ms));
  });
  save(META, meta);
}
function fire(i, key){
  if (i.done) return;
  notify(`⏰ ${i.time} ${i.urgent ? '【急】' : ''}${i.title}`, '時間到了', key);
  meta.fired = [...(meta.fired || []), key]; save(META, meta);
  toast(`時間到：${i.title}`);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){
    const t = todayStr();
    if (lastToday !== t){ // 跨日：原本停在「今天」就自動翻到新的一天
      if (selected === lastToday){ selected = t; weekStart = startOfWeek(new Date()) }
      lastToday = t;
    }
    render(); dailySummary(); scheduleTimers();
  }
});

/* ========= 深淺色 ========= */
const THEMES = { auto: '跟隨系統', light: '淺色', dark: '深色' };
function applyTheme(){
  const th = meta.theme || 'auto';
  if (th === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
  const ic = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg>'
  };
  $('themeBtn').innerHTML = ic[th];
  $('themeBtn').setAttribute('aria-label', `外觀：${THEMES[th]}，點一下切換`);
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
  document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
}
$('themeBtn').onclick = () => {
  const order = ['auto', 'light', 'dark'];
  meta.theme = order[(order.indexOf(meta.theme || 'auto') + 1) % 3]; save(META, meta);
  applyTheme(); toast(`外觀：${THEMES[meta.theme]}`);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ========= 整月月曆 ========= */
let mView = null; // 該月 1 號
function openMonth(){ const d = parse(selected); mView = new Date(d.getFullYear(), d.getMonth(), 1); renderMonth(); $('monthDlg').showModal() }
function renderMonth(){
  const y = mView.getFullYear(), m = mView.getMonth(), t = todayStr();
  $('mTitle').textContent = `${y} 年 ${m+1} 月`;
  const first = startOfWeek(mView);
  const last = new Date(y, m+1, 0);
  const weeks = Math.ceil((last.getDate() + mView.getDay()) / 7);
  let html = WD.map(w => `<div class="wdh">${w}</div>`).join('');
  for (let n = 0; n < weeks * 7; n++){
    const d = addDays(first, n), s = ymd(d);
    const list = items.filter(i => i.date === s);
    const left = list.filter(i => !i.done);
    const urg = left.some(i => i.urgent);
    const mark = left.length ? `${urg ? '<i class="u"></i>' : ''}${left.length}` : list.length ? '<span class="ok">✓</span>' : '';
    const cls = ['mcell', d.getMonth() !== m && 'out', d.getDay() === 0 && 'sun', s === t && 'today', s === selected && 'sel'].filter(Boolean).join(' ');
    const label = `${d.getMonth()+1}月${d.getDate()}日${left.length ? `，${left.length} 件未完成${urg ? '，含急件' : ''}` : list.length ? '，全部完成' : ''}`;
    html += `<button type="button" class="${cls}" data-d="${s}" aria-label="${label}"><b>${d.getDate()}</b><span class="n">${mark}</span></button>`;
  }
  $('mGrid').innerHTML = html;
}
$('mGrid').addEventListener('click', e => { const c = e.target.closest('.mcell'); if (!c) return; $('monthDlg').close(); goTo(c.dataset.d) });
$('mPrev').onclick = () => { mView = new Date(mView.getFullYear(), mView.getMonth() - 1, 1); renderMonth() };
$('mNext').onclick = () => { mView = new Date(mView.getFullYear(), mView.getMonth() + 1, 1); renderMonth() };
$('mToday').onclick = () => { $('monthDlg').close(); goTo(todayStr()) };
$('mClose').onclick = () => $('monthDlg').close();
$('monthBtn').onclick = openMonth;
$('sheet').onclick = openMonth;
$('sheet').onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openMonth() } };
// 左右滑動切換月份
let sx = null;
$('mGrid').addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
$('mGrid').addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) (dx < 0 ? $('mNext') : $('mPrev')).click() });

/* ========= 其他 ========= */
let tt;
function toast(s){ const el = $('toast'); el.textContent = s; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1600) }

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

applyTheme();
render();
bellState();
dailySummary();
scheduleTimers();
</script>
